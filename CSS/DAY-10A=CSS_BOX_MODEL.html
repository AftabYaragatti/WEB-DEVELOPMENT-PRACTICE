<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAY-9A</title>
    <style>
        .main {
            margin: 50px;
            text-align: center;
        }
        /* Block */
        .A {
            height: 100px;
            width: 200px;
            background: rgb(213, 227, 16);
            display: block;
        }
        .B {
            height: 100px;
            width: 200px;
            background: rgb(247, 92, 255);
            display: block;
        }
        .C {
            height: 100px;
            width: 200px;
            background: cyan;
            display: block;
        }
        .D {
            height: 100px;
            width: 200px;
            background: rgb(33, 232, 33);
            display: block;
        }
        /* Inline */
        .A1 {
            height: 100px;
            width: 200px;
            background: rgb(213, 227, 16);
            display: inline;
        }
        .B1 {
            height: 100px;
            width: 200px;
            background: rgb(247, 92, 255);
            display: inline;
        }
        .C1 {
            height: 100px;
            width: 200px;
            background: cyan;
            display: inline;
        }
        .D1 {
            height: 100px;
            width: 200px;
            background: rgb(33, 232, 33);
            display: inline;
        }
        /* Inline-Block */
        .A2 {
            height: 100px;
            width: 200px;
            background: rgb(213, 227, 16);
            display: inline-block;
        }
        .B2 {
            height: 100px;
            width: 200px;
            background: rgb(247, 92, 255);
            display: inline-block;
        }
        .C2 {
            height: 100px;
            width: 200px;
            background: cyan;
            display: inline-block;
        }
        .D2 {
            height: 100px;
            width: 200px;
            background: rgb(33, 232, 33);
            display: inline-block;
        }
        /* Flex */
        .A3 {
            height: 100px;
            width: 200px;
            background: rgb(213, 227, 16);
            display: flex;
        }
        .B3 {
            height: 100px;
            width: 200px;
            background: rgb(247, 92, 255);
            display: flex;
        }
        .C3 {
            height: 100px;
            width: 200px;
            background: cyan;
            display: flex;
        }
        .D3 {
            height: 100px;
            width: 200px;
            background: rgb(33, 232, 33);
            display: flex;
        }
        /* Grid */
        .A4 {
            height: 100px;
            width: 200px;
            background: rgb(213, 227, 16);
            display: Grid;
        }
        .B4 {
            height: 100px;
            width: 200px;
            background: rgb(247, 92, 255);
            display: Grid;
        }
        .C4 {
            height: 100px;
            width: 200px;
            background: cyan;
            display: Grid;
        }
        .D4 {
            height: 100px;
            width: 200px;
            background: rgb(33, 232, 33);
            display: Grid;
        }
        /* None */
        .A5 {
            height: 100px;
            width: 200px;
            background: rgb(213, 227, 16);
            display: none;
        }
        .B5 {
            height: 100px;
            width: 200px;
            background: rgb(247, 92, 255);
            display: none;
        }
        .C5 {
            height: 100px;
            width: 200px;
            background: cyan;
            display: none;
        }
        .D5 {
            height: 100px;
            width: 200px;
            background: rgb(33, 232, 33);
            display: none;
        }
    </style>
</head>
<body>
    <div class="main">Block
        <div class="A">A</div>
        <div class="B">B</div>
        <div class="C">C</div>
        <div class="D">D</div>
    </div>
    <div class="main">Inline
        <div class="A1">A</div>
        <div class="B1">B</div>
        <div class="C1">C</div>
        <div class="D1">D</div>
    </div>
    <div class="main">Inline-Block
        <div class="A2">A</div>
        <div class="B2">B</div>
        <div class="C2">C</div>
        <div class="D2">D</div>
    </div>
    <div class="main">FLex
        <div class="A3">A</div>
        <div class="B3">B</div>
        <div class="C3">C</div>
        <div class="D3">D</div>
    </div>
    <div class="main">Grid
        <div class="A4">A</div>
        <div class="B4">B</div>
        <div class="C4">C</div>
        <div class="D4">D</div>
    </div>
    <div class="main">None
        <div class="A5">A</div>
        <div class="B5">B</div>
        <div class="C5">C</div>
        <div class="D5">D</div>
    </div>
</body>
</html>
